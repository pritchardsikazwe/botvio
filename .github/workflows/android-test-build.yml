name: Botvio Android Test Builds

on:
  workflow_dispatch:
  push:
    branches:
      - botvio-independent-sep13

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  android:
    name: Android Test - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: gold-robot
            name: Botvio Gold Robot
            app_id: live.botvio.gold
          - id: crypto-robot
            name: Botvio Crypto Robot
            app_id: live.botvio.crypto
          - id: synthetic-robot
            name: Botvio Synthetic Robot
            app_id: live.botvio.synthetic
          - id: weltrade-robot
            name: Botvio Weltrade Robot
            app_id: live.botvio.weltrade
          - id: deriv-copy
            name: Botvio Deriv Copy Trading
            app_id: live.botvio.copy

    env:
      CAP_APP_ID: ${{ matrix.app_id }}
      CAP_APP_NAME: ${{ matrix.name }}
      VITE_STANDALONE_APP_ID: ${{ matrix.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare app icon
        run: |
          mkdir -p resources
          cp public/icon-512.png resources/icon.png

      - name: Build focused web app
        run: |
          cp index.mobile.html index.store.html
          cp index.mobile.html index.html
          npx vite build --outDir dist --base ./
          rm -f index.store.html
        env:
          VITE_STORE_BUILD: "true"
          VITE_STANDALONE_APP_ID: ${{ matrix.id }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Gradle
        run: chmod +x android/gradlew

      - name: Build debug APK for phone testing
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-android-apk-test
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-android-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
