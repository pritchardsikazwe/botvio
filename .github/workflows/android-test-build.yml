name: Botvio Android Test Builds

on:
  workflow_dispatch:
  push:
    branches:
      - botvio-independent-sep13

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  android:
    name: Android Test - ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: gold-robot
            name: Botvio Gold Robot
            app_id: live.botvio.goldai
          - id: crypto-robot
            name: Botvio Crypto Robot
            app_id: live.botvio.cryptoai
          - id: synthetic-robot
            name: Botvio Synthetic Robot
            app_id: live.botvio.syntheticai
          - id: weltrade-robot
            name: Botvio Weltrade Robot
            app_id: live.botvio.weltradeai
          - id: deriv-copy
            name: Botvio Deriv Copy Trading
            app_id: live.botvio.copy

    env:
      CAP_APP_ID: ${{ matrix.app_id }}
      CAP_APP_NAME: ${{ matrix.name }}
      VITE_STANDALONE_APP_ID: ${{ matrix.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare app icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path resources | Out-Null
          Copy-Item public/icon-512.png resources/icon.png -Force

      - name: Build focused web app
        shell: pwsh
        run: |
          Copy-Item index.mobile.html index.store.html -Force
          Copy-Item index.mobile.html index.html -Force
          npx vite build --outDir dist --base ./
          Remove-Item index.store.html -Force -ErrorAction SilentlyContinue
        env:
          VITE_STORE_BUILD: "true"
          VITE_STANDALONE_APP_ID: ${{ matrix.id }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Create Capacitor Android project
        run: npx cap add android

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        shell: pwsh
        run: |
          & sdkmanager --licenses
          & sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Gradle
        shell: pwsh
        run: |
          if (Test-Path android/gradlew.bat) {
            Write-Host "Gradle wrapper ready"
          } else {
            throw "android/gradlew.bat was not generated"
          }

      - name: Build debug APK for phone testing
        working-directory: android
        run: .\gradlew.bat assembleDebug --stacktrace

      - name: Build release AAB
        working-directory: android
        run: .\gradlew.bat bundleRelease --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-android-apk-test
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-android-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
