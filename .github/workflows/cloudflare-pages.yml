name: Deploy Botvio to Cloudflare Pages

on:
  push:
    branches:
      - botvio-independent-sep13
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy Botvio
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          VITE_SUPABASE_URL: https://bkygpojmlxcikhbuqgmv.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify production Supabase target
        run: |
          if ! grep -R "bkygpojmlxcikhbuqgmv.supabase.co" dist/assets >/dev/null; then
            echo "ERROR: production bundle does not contain the required Supabase project URL."
            exit 1
          fi
          if grep -R "tqqkzeblmjapgbnsbtgw.supabase.co" dist/assets >/dev/null; then
            echo "ERROR: old Supabase project URL detected in production bundle."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=botvio
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
