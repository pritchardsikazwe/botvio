name: Deploy Botvio Frontend

on:
  push:
    branches:
      - botvio-independent-sep13
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "wrangler.jsonc"
      - "tsconfig*.json"
      - "tailwind.config.*"
      - ".github/workflows/deploy-botvio-frontend.yml"
  workflow_dispatch:

concurrency:
  group: botvio-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build production frontend
        run: npm run build

      - name: Verify production backend target
        run: |
          set -euo pipefail
          if ! grep -R "tqqkzeblmjapgbnsbtgw.supabase.co" dist/assets >/dev/null 2>&1; then
            echo "::error::Expected current production Supabase target was not found in the frontend bundle."
            exit 1
          fi
          if grep -R "bkygpojmlxcikhbuqgmv.supabase.co" dist/assets >/dev/null 2>&1; then
            echo "::error::Independent migration Supabase URL detected in the production frontend bundle. Migration is not approved yet."
            exit 1
          fi

      - name: Verify build version
        run: |
          set -euo pipefail
          test -s dist/version.json
          cat dist/version.json

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN."
            exit 1
          }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID."
            exit 1
          }

      - name: Deploy Botvio Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@latest deploy

      - name: Verify live Botvio version
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            LIVE_VERSION="$(curl -fsSL --max-time 15 "https://botvio.live/version.json?t=$(date +%s)" | tr -d '\n' || true)"
            if [ -n "$LIVE_VERSION" ]; then
              echo "Live Botvio version:"
              echo "$LIVE_VERSION"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Deployment completed but botvio.live/version.json could not be verified."
          exit 1

# Trigger production deployment for the current homepage build.
