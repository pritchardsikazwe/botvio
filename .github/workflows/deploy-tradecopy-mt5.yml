name: Deploy TradeCopy MT5 Signal Routing

on:
  push:
    branches:
      - botvio-independent-sep13
    paths:
      - "supabase/functions/tradecopy-api/**"
      - "supabase/functions/_shared/tradecopy/**"
      - ".github/workflows/deploy-tradecopy-mt5.yml"
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      deploy_signal_functions:
        description: "Also deploy Botvio signal generators and automation endpoints"
        required: true
        default: true
        type: boolean

concurrency:
  group: tradecopy-mt5-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN. Add the Supabase personal access token to this repository before deployment."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PROJECT_REF. Expected the Botvio Supabase project ref."
            exit 1
          fi
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *)
              echo "::error::SUPABASE_ACCESS_TOKEN must be a Supabase personal access token beginning with sbp_."
              exit 1
              ;;
          esac
          echo "Supabase project ref configured: ${SUPABASE_PROJECT_REF:0:6}******"
          npx supabase@latest --version

      - name: Link Supabase project for IPv4 connectivity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply pending Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "Checking pending migrations before deployment..."
          npx supabase@latest migration list --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase@latest db push --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Deploy TradeCopy API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest functions deploy tradecopy-api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy Deriv Options copy engine
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest functions deploy provider-execute-copy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Retire legacy MT5 provider event
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest functions deploy provider-event --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy MT5 direct execution
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest functions deploy mt5-direct-execution --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Retire legacy MT5 bridge queue
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest functions deploy queue-hub-trade --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy signal generators
        if: ${{ inputs.deploy_signal_functions }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase@latest functions deploy generate-cfd-signals --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase@latest functions deploy generate-syntx-signals --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase@latest functions deploy generate-deriv-synthetic-signals --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase@latest functions deploy evaluate-live-signals --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase@latest functions deploy top-assets-ranking --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase@latest functions deploy signal-performance-audit --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase@latest functions deploy record-weltrade-signals --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
