name: Deploy TradeCopy MT5 Signal Routing

on:
  workflow_dispatch:
    inputs:
      deploy_signal_functions:
        description: "Also deploy Botvio signal generators"
        required: true
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::Missing SUPABASE_PROJECT_REF"; exit 1; }

      - name: Apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest db push --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy TradeCopy API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest functions deploy tradecopy-api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy MT5 direct execution
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest functions deploy mt5-direct-execution --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy signal generators
        if: ${{ inputs.deploy_signal_functions }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase@latest functions deploy generate-cfd-signals --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase@latest functions deploy generate-syntx-signals --project-ref "$SUPABASE_PROJECT_REF"
          npx supabase@latest functions deploy generate-deriv-synthetic-signals --project-ref "$SUPABASE_PROJECT_REF"
