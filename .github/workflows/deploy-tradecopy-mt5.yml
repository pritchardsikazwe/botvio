name: Deploy TradeCopy MT5 Signal Routing

on:
  push:
    branches:
      - botvio-independent-sep13
    paths:
      - "supabase/functions/tradecopy-api/**"
      - "supabase/functions/_shared/tradecopy/**"
      - ".github/workflows/deploy-tradecopy-mt5.yml"
  workflow_dispatch:
    inputs:
      deploy_signal_functions:
        description: "Also deploy Botvio signal generators and automation endpoints"
        required: true
        default: true
        type: boolean

concurrency:
  group: tradecopy-mt5-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN. Add the Supabase personal access token to this repository before deployment."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Missing GitHub Actions secret SUPABASE_PROJECT_REF. Expected the Botvio Supabase project ref."
            exit 1
          fi
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *)
              echo "::error::SUPABASE_ACCESS_TOKEN must be a Supabase personal access token beginning with sbp_."
              exit 1
              ;;
          esac
          echo "Supabase project ref configured: ${SUPABASE_PROJECT_REF:0:6}******"
          npx supabase@latest --version

      - name: Link Supabase project for IPv4 connectivity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Repair known remote migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          versions=(
            20260126090748 20260128200946 20260130200058
            20260130200426 20260130203101 20260130204936 20260130211315 20260130222931 20260130233759
            20260131055550 20260131063701 20260131120132 20260131122551 20260131132159 20260131132213
            20260201082309 20260201150346 20260201174513 20260201184019
            20260202062902 20260202110235 20260202110819 20260202112052
            20260204071314 20260206103513 20260206103542 20260206105512 20260206111108 20260206113411
            20260207042445 20260210055844 20260214113701 20260217092458
            20260218135036 20260218135605 20260218142246 20260218144731
            20260224102808 20260226083253 20260227185048
            20260305155031 20260305161051 20260306091828 20260306091926 20260306093122 20260306095851 20260306100646 20260306103559 20260306164436
            20260309144121 20260309151008 20260311123041 20260313114708 20260313130046 20260316111027 20260317105427 20260317133357 20260318081445 20260319082705
            20260326054148 20260327082840 20260331094225 20260331140113 20260331141851 20260331144854
            20260401124426 20260401143128 20260403082243 20260405055357 20260407094558
            20260410113810 20260410114434 20260418154241 20260419184927 20260419193306
            20260420102856 20260423090925 20260427090424 20260427095230
            20260429045412 20260430103557 20260430110702 20260430111531 20260430113450 20260430114738 20260430135910 20260430141759 20260430143012
            20260501100000 20260502060449 20260506132909 20260518104605 20260524200959
            20260703150505 20260729134129 20260730113149 20260730124838 20260730130501 20260730132538 20260730214603
            20260730214603
            20260803151542 20260803154626 20260830160257 20260830162806 20260830165536
            20260930130000
            20261001010000 20261001020000 20261002000000 20261002010000 20261002020000 20261002030000
            20261003050000 20261003060000 20261003150000 20261003170000
            20261003183000 20261003200000 20261004101500
          )
          for version in "${versions[@]}"; do
            echo "Marking remote migration as applied: $version"
            npx supabase@latest migration repair --status applied "$version" --project-ref "$SUPABASE_PROJECT_REF"
          done

      - name: Pull remote schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          npx supabase@latest db pull --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Deploy TradeCopy API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest functions deploy tradecopy-api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy Deriv Options copy engine
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest functions deploy provider-execute-copy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Retire legacy MT5 provider event
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest functions deploy provider-event --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy MT5 direct execution
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest functions deploy mt5-direct-execution --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Retire legacy MT5 bridge queue
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: npx supabase@latest functions deploy queue-hub-trade --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy signal generators
        if: ${{ inputs.deploy_signal_functions }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase@latest functions deploy generate-cfd-signals --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase@latest functions deploy generate-syntx-signals --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase@latest functions deploy generate-deriv-synthetic-signals --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase@latest functions deploy evaluate-live-signals --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase@latest functions deploy top-assets-ranking --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase@latest functions deploy signal-performance-audit --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          npx supabase@latest functions deploy record-weltrade-signals --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
