name: Botvio News Intelligence Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  refresh-news-intelligence:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh news intelligence
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          set -e
          test -n "$VITE_SUPABASE_URL"
          curl --fail --silent --show-error --max-time 45 \
            -X POST "$VITE_SUPABASE_URL/functions/v1/news-intelligence-worker" \
            -H "Content-Type: application/json" \
            --data '{"mode":"refresh","source":"github-cron"}'
